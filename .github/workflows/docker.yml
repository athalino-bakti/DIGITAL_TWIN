name: Docker

# DIG-216: build image produksi API dan frontend, lalu jalankan bersama PostgreSQL lewat
# compose.prod.yaml dan periksa bahwa semuanya hidup. Image tidak di-push ke registry di sini;
# itu bagian pipeline deploy staging (DIG-205).

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "compose.prod.yaml"
      - ".github/workflows/docker.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Docker (build + uji jalan)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: ci-postgres-password
      COMPOSE_FILE: compose.prod.yaml
    steps:
      - uses: actions/checkout@v4

      - name: Buat JWT_SECRET_KEY sementara
        run: echo "JWT_SECRET_KEY=$(openssl rand -base64 48)" >> "$GITHUB_ENV"

      - name: Build image
        run: docker compose build

      - name: Jalankan
        run: |
          set -euo pipefail
          docker compose up -d
          # Tunggu nginx dan API siap (termasuk migrasi yang berjalan lebih dulu).
          for i in $(seq 1 90); do
            if curl -fsS -o /dev/null http://localhost:8080/api/v1/health/ready; then break; fi
            sleep 2
          done
          test "$(docker compose ps -a migrate --format '{{.ExitCode}}')" = 0
          docker compose ps -a

      - name: Frontend dan API lewat nginx
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          # Rute React Router dijawab index.html.
          curl -fsS http://localhost:8080/login | grep -q '<div id="root">'
          curl -fsS http://localhost:8080/api/v1/health/ready
          echo
          # Endpoint data butuh login.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/data/projects)" = 401

      - name: Header keamanan (DIG-208)
        run: |
          set -euo pipefail
          for path in / /api/v1/health; do
            headers=$(curl -fsS -D - -o /dev/null "http://localhost:8080$path")
            echo "== $path"; echo "$headers"
            echo "$headers" | grep -qi "^content-security-policy: default-src 'self'; script-src 'self';"
            echo "$headers" | grep -qi '^x-content-type-options: nosniff'
            echo "$headers" | grep -qi '^x-frame-options: deny'
            echo "$headers" | grep -qi '^referrer-policy: strict-origin-when-cross-origin'
            echo "$headers" | grep -qi '^permissions-policy: camera=()'
            echo "$headers" | grep -qi '^cross-origin-opener-policy: same-origin'
            ! echo "$headers" | grep -qi '^server: nginx/'
            # HSTS hanya setelah HTTPS (DIG-206); header yang sama tidak boleh terkirim dua kali.
            ! echo "$headers" | grep -qi '^strict-transport-security:'
            test "$(echo "$headers" | grep -ci '^x-frame-options:')" = 1
          done
          curl -fsS -D - -o /dev/null http://localhost:8080/api/v1/health | grep -qi '^cache-control: no-store'

      - name: Container berjalan tanpa root
        run: |
          set -euo pipefail
          test "$(docker compose exec -T api id -u)" != 0
          test "$(docker compose exec -T web id -u)" != 0

      - name: Migrasi sampai head
        run: docker compose run --rm migrate alembic current | grep -q '(head)'

      - name: Log bila gagal
        if: failure()
        run: docker compose logs --no-color

      - name: Bersihkan
        if: always()
        run: docker compose down -v
